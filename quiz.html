<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f5f7">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" href="data:,">
<title>KNF - Pytania</title>
<style>
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: start center; padding: 24px;
    background: #f4f5f7; color: #16181d;
    font: 16px/1.6 system-ui, "Segoe UI", Roboto, sans-serif;
  }
  .card {
    width: 100%; max-width: 720px; background: #fff; border: 1px solid #d8dbe0;
    border-radius: 12px; padding: 28px; box-shadow: 0 6px 20px rgba(0,0,0,.07);
  }
  h1 { margin: 0 0 4px; font-size: 20px; }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .05em;
       color: #6b7280; margin: 22px 0 10px; }
  .sub { margin: 0 0 20px; color: #6b7280; font-size: 13px; }
  button {
    width: 100%; padding: 11px; font-size: 15px; font-weight: 600; cursor: pointer;
    color: #fff; background: #2563eb; border: 0; border-radius: 8px; margin-bottom: 10px;
  }
  button.ghost { background: #fff; color: #2563eb; border: 1px solid #d8dbe0; }
  button:disabled { opacity: .6; cursor: default; }
  .msg { padding: 10px 12px; border-radius: 8px; font-size: 13px; margin-bottom: 16px;
         background: #fdecec; color: #a01b1b; border: 1px solid #f2c2c2; }
  .hidden { display: none; }

  /* mode switch */
  .seg { display: flex; gap: 0; margin-bottom: 4px; }
  .seg button {
    flex: 1; margin: 0; border-radius: 0; font-size: 14px; font-weight: 500;
    background: #fff; color: #16181d; border: 1px solid #d8dbe0;
  }
  .seg button:first-child { border-radius: 8px 0 0 8px; }
  .seg button:last-child { border-radius: 0 8px 8px 0; border-left: 0; }
  .seg button.on { background: #2563eb; color: #fff; border-color: #2563eb; font-weight: 600; }
  .segnote { font-size: 12px; color: #9aa2ad; margin: 0 0 6px; }

  /* test list */
  .item {
    display: flex; align-items: center; gap: 12px; width: 100%; text-align: left;
    padding: 13px 15px; margin-bottom: 8px; font-size: 15px; font-weight: 500;
    color: #16181d; background: #fff; border: 1px solid #d8dbe0; border-radius: 9px;
    cursor: pointer;
  }
  .item:hover:not(:disabled) { border-color: #2563eb; background: #f7f9ff; }
  .item .grow { flex: 1; }
  .item .count { font-size: 13px; font-weight: 400; color: #6b7280; }
  .item.all { border-color: #2563eb; color: #1d4ed8; }

  /* quiz */
  .bar-top {
    display: flex; justify-content: space-between; gap: 10px; font-size: 13px;
    color: #6b7280; margin-bottom: 6px;
  }
  .which { font-size: 12px; color: #9aa2ad; margin: 0 0 14px; }
  .stem { font-size: 17px; margin: 0 0 20px; }
  .opt {
    display: flex; gap: 12px; width: 100%; text-align: left; padding: 12px 14px;
    margin-bottom: 9px; font-size: 15px; font-weight: 400; line-height: 1.45;
    color: #16181d; background: #fff; border: 1px solid #d8dbe0; border-radius: 9px;
    cursor: pointer;
  }
  .opt:hover:not(:disabled) { border-color: #2563eb; background: #f7f9ff; }
  .opt .letter { font-weight: 700; color: #6b7280; flex: none; }
  .opt.correct { background: #eaf6ee; border-color: #4caf72; color: #14532d; }
  .opt.correct .letter { color: #1a6b34; }
  .opt.wrong { background: #fdecec; border-color: #e57373; color: #7f1d1d; }
  .opt.wrong .letter { color: #a01b1b; }
  .opt:disabled { cursor: default; opacity: 1; }
  .verdict { font-weight: 600; margin: 16px 0 12px; }
  .verdict.good { color: #1a6b34; }
  .verdict.bad { color: #a01b1b; }
  .score { font-variant-numeric: tabular-nums; }
  .hint { font-size: 12px; color: #9aa2ad; margin-top: 14px; }

  /* phone: edge-to-edge card, bigger tap targets, no keyboard hint */
  @media (max-width: 640px) {
    body { padding: 0; font-size: 17px; }
    .card {
      max-width: none; min-height: 100vh; border: 0; border-radius: 0;
      box-shadow: none; padding: 20px 16px calc(20px + env(safe-area-inset-bottom));
    }
    .stem { font-size: 17px; }
    .opt { padding: 14px 15px; font-size: 16px; }
    .item { padding: 15px; font-size: 16px; }
    button { padding: 14px; font-size: 16px; }
    .seg button { padding: 11px; }
    .hint { display: none; }
  }
</style>
</head>
<body>

<div class="card">

  <!-- LOGIN -->
  <div id="loginBox" class="hidden">
    <h1>Logowanie</h1>
    <p class="sub">Zaloguj się, aby rozwiązywać pytania</p>
    <div id="loginErr" class="msg hidden"></div>
    <form id="loginForm">
      <label>E-mail</label>
      <input type="email" id="email" required style="width:100%;padding:10px 12px;margin-bottom:14px;font-size:16px;border:1px solid #d8dbe0;border-radius:8px;box-sizing:border-box;">
      <label>Hasło</label>
      <input type="password" id="password" required style="width:100%;padding:10px 12px;margin-bottom:14px;font-size:16px;border:1px solid #d8dbe0;border-radius:8px;box-sizing:border-box;">
      <button type="submit">Zaloguj się</button>
    </form>
  </div>

  <!-- PICK A TEST -->
  <div id="pickBox" class="hidden">
    <h1>Pytania egzaminacyjne</h1>
    <p class="sub" id="pickSub">Ładowanie...</p>
    <div id="err" class="msg hidden"></div>

    <h2>Kolejność pytań</h2>
    <div class="seg">
      <button id="modeRandom" class="on" type="button">Losowa</button>
      <button id="modeOrder" type="button">Po kolei (1&nbsp;→&nbsp;koniec)</button>
    </div>
    <p class="segnote" id="modeNote">Pytania w losowej kolejności.</p>

    <h2>Wybierz test</h2>
    <div id="list"></div>

    <button id="logout" class="ghost" style="margin-top:14px;">Wyloguj się</button>
  </div>

  <!-- QUIZ -->
  <div id="quizBox" class="hidden">
    <div class="bar-top">
      <span id="pos"></span>
      <span class="score">Poprawne: <b id="good">0</b> / <b id="asked">0</b></span>
    </div>
    <p class="which" id="which"></p>
    <p class="stem" id="stem"></p>
    <div id="opts"></div>
    <p class="verdict hidden" id="verdict"></p>
    <button id="next" class="hidden">Następne pytanie</button>
    <button id="quit" class="ghost">Zakończ</button>
    <p class="hint">Skrót: A/B/C/D lub 1-4 aby odpowiedzieć, Enter aby przejść dalej.</p>
  </div>

  <!-- DONE -->
  <div id="doneBox" class="hidden">
    <h1>Koniec</h1>
    <p class="sub" id="doneSub"></p>
    <button id="again">Jeszcze raz (ten sam zestaw)</button>
    <button id="home" class="ghost">Wybierz inny test</button>
  </div>

</div>

<script src="https://www.gstatic.com/firebasejs/11.0.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/11.0.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore-compat.js"></script>

<script>
firebase.initializeApp({
  apiKey: "AIzaSyBjg6qDO4AG6LvRomoGe8Al8Gjk_N2rPlw",
  authDomain: "knfquestions.firebaseapp.com",
  projectId: "knfquestions",
  storageBucket: "knfquestions.firebasestorage.app",
  messagingSenderId: "820771001390",
  appId: "1:820771001390:web:f62c15dbc743a8b6f5fbbf",
});

var auth = firebase.auth();
var db = firebase.firestore();
var $ = function (id) { return document.getElementById(id); };
var LETTERS = ["A", "B", "C", "D"];

var exams = [];          // summary docs, one per uploaded test
var mode = "random";     // "random" | "order"
var deck = [];           // questions for this run, already ordered
var lastPick = null;     // {examId, label} so "jeszcze raz" can repeat it
var i = 0, good = 0, asked = 0, locked = false;

function show(which) {
  ["loginBox", "pickBox", "quizBox", "doneBox"].forEach(function (id) {
    $(id).classList.toggle("hidden", id !== which);
  });
}
function showErr(t) { $("err").textContent = t; $("err").classList.remove("hidden"); }

// ---- auth -----------------------------------------------------------------
$("loginForm").onsubmit = function (e) {
  e.preventDefault();
  $("loginErr").classList.add("hidden");
  auth.signInWithEmailAndPassword($("email").value.trim(), $("password").value)
    .catch(function (err) {
      $("loginErr").textContent = "Nie udało się zalogować: " + err.code;
      $("loginErr").classList.remove("hidden");
    });
};
$("logout").onclick = function () { auth.signOut(); };

auth.onAuthStateChanged(function (user) {
  if (!user) { show("loginBox"); return; }
  show("pickBox");
  loadExams();
});

// ---- mode switch ----------------------------------------------------------
function setMode(m) {
  mode = m;
  $("modeRandom").classList.toggle("on", m === "random");
  $("modeOrder").classList.toggle("on", m === "order");
  $("modeNote").textContent = m === "random"
    ? "Pytania w losowej kolejności."
    : "Pytania po kolei, od 1 do końca, tak jak w arkuszu.";
}
$("modeRandom").onclick = function () { setMode("random"); };
$("modeOrder").onclick = function () { setMode("order"); };

// ---- list the tests -------------------------------------------------------
// Only the exam summary docs are read here (one per test), not the questions
// themselves - the questions are fetched once you pick a test.
function loadExams() {
  $("pickSub").textContent = "Ładowanie listy testów...";
  $("err").classList.add("hidden");
  db.collection("exams").get()
    .then(function (snap) {
      exams = snap.docs.map(function (d) { return d.data(); })
        .sort(function (a, b) { return String(b.date).localeCompare(String(a.date)); });
      renderList();
    })
    .catch(function (err) {
      $("pickSub").textContent = "Błąd wczytywania.";
      showErr("Błąd: " + (err.code || err.message));
      console.error(err);
    });
}

function renderList() {
  var box = $("list");
  box.textContent = "";

  if (!exams.length) {
    $("pickSub").textContent = "Brak testów w bazie.";
    showErr("Najpierw wgraj testy w panelu (index.html).");
    return;
  }

  var total = exams.reduce(function (n, e) { return n + (e.count || 0); }, 0);
  $("pickSub").textContent = exams.length + " testów, " + total + " pytań w bazie.";

  exams.forEach(function (e) {
    box.appendChild(itemButton(
      e.date || e.examId,
      (e.count || 0) + " pytań",
      false,
      function () { startExam(e.examId, e.date || e.examId); }
    ));
  });

  box.appendChild(itemButton(
    "Wszystkie pytania",
    total + " pytań ze wszystkich testów",
    true,
    function () { startExam(null, "Wszystkie testy"); }
  ));
}

function itemButton(title, sub, isAll, onClick) {
  var b = document.createElement("button");
  b.className = "item" + (isAll ? " all" : "");
  b.type = "button";
  var g = document.createElement("span");
  g.className = "grow";
  g.textContent = title;
  var c = document.createElement("span");
  c.className = "count";
  c.textContent = sub;
  b.appendChild(g);
  b.appendChild(c);
  b.onclick = onClick;
  return b;
}

// ---- start a run ----------------------------------------------------------
// examId === null means "every test".
function startExam(examId, label) {
  lastPick = { examId: examId, label: label };
  setListBusy(true);
  $("err").classList.add("hidden");
  $("pickSub").textContent = "Wczytywanie pytań...";

  var q = examId
    ? db.collection("questions").where("examId", "==", examId)
    : db.collection("questions");

  q.get()
    .then(function (snap) {
      var qs = snap.docs.map(function (d) { return d.data(); });
      if (!qs.length) {
        showErr("Ten test nie ma pytań w bazie.");
        return;
      }
      begin(qs, label);
    })
    .catch(function (err) {
      // "jeszcze raz" can start a run from the results screen, so make sure
      // the error is on a screen that is actually visible
      show("pickBox");
      showErr("Błąd: " + (err.code || err.message));
      console.error(err);
    })
    .then(function () {
      setListBusy(false);
      renderList();
    });
}

function setListBusy(b) {
  Array.prototype.forEach.call($("list").querySelectorAll("button"), function (x) {
    x.disabled = b;
  });
}

function shuffle(a) {                       // Fisher-Yates
  a = a.slice();
  for (var j = a.length - 1; j > 0; j--) {
    var k = Math.floor(Math.random() * (j + 1));
    var t = a[j]; a[j] = a[k]; a[k] = t;
  }
  return a;
}

// Firestore returns documents in no useful order, so "po kolei" has to sort
// explicitly: by exam date first (only matters when mixing every test), then
// by the question number printed in the paper.
function inPaperOrder(a) {
  return a.slice().sort(function (x, y) {
    var d = String(x.examDate || "").localeCompare(String(y.examDate || ""));
    return d !== 0 ? d : (x.number || 0) - (y.number || 0);
  });
}

function begin(qs, label) {
  deck = mode === "random" ? shuffle(qs) : inPaperOrder(qs);
  i = 0; good = 0; asked = 0;
  $("good").textContent = "0";
  $("asked").textContent = "0";
  $("which").textContent = label + "  -  " + deck.length + " pytań  -  " +
    (mode === "random" ? "losowo" : "po kolei");
  show("quizBox");
  render();
}

// ---- one question ---------------------------------------------------------
function render() {
  locked = false;
  var q = deck[i];
  $("pos").textContent = "Pytanie " + (i + 1) + " z " + deck.length;
  $("stem").textContent = q.number + ". " + q.question;
  $("verdict").classList.add("hidden");
  $("next").classList.add("hidden");

  var box = $("opts");
  box.textContent = "";
  LETTERS.forEach(function (L) {
    var b = document.createElement("button");
    b.className = "opt";
    b.type = "button";
    var s = document.createElement("span");
    s.className = "letter";
    s.textContent = L + ".";
    var t = document.createElement("span");
    t.textContent = q.options[L];
    b.appendChild(s);
    b.appendChild(t);
    b.dataset.letter = L;
    b.onclick = function () { answer(L); };
    box.appendChild(b);
  });
}

function answer(picked) {
  if (locked) return;
  locked = true;
  var q = deck[i];
  var right = picked === q.answer;

  asked++;
  if (right) good++;
  $("good").textContent = good;
  $("asked").textContent = asked;

  Array.prototype.forEach.call($("opts").querySelectorAll("button"), function (b) {
    b.disabled = true;
    if (b.dataset.letter === q.answer) b.classList.add("correct");
    else if (b.dataset.letter === picked) b.classList.add("wrong");
  });

  var v = $("verdict");
  v.textContent = right ? "Dobrze!" : "Źle. Poprawna odpowiedź to " + q.answer + ".";
  v.className = "verdict " + (right ? "good" : "bad");
  v.classList.remove("hidden");

  $("next").textContent = (i + 1 < deck.length) ? "Następne pytanie" : "Zobacz wynik";
  $("next").classList.remove("hidden");
}

$("next").onclick = function () {
  if (i + 1 < deck.length) { i++; render(); }
  else finish();
};
$("quit").onclick = finish;

function finish() {
  var pct = asked ? Math.round((good / asked) * 100) : 0;
  $("doneSub").textContent = (lastPick ? lastPick.label + ": " : "") +
    "poprawne odpowiedzi " + good + " z " + asked + " (" + pct + "%).";
  show("doneBox");
}

$("again").onclick = function () {
  if (lastPick) startExam(lastPick.examId, lastPick.label);
};
$("home").onclick = function () {
  show("pickBox");
  $("pickSub").textContent = exams.length + " testów w bazie.";
  renderList();
};

// ---- keyboard shortcuts ---------------------------------------------------
document.addEventListener("keydown", function (e) {
  if ($("quizBox").classList.contains("hidden")) return;
  var k = e.key.toUpperCase();
  if (!locked && LETTERS.indexOf(k) >= 0) { answer(k); return; }
  if (!locked && k >= "1" && k <= "4") { answer(LETTERS[+k - 1]); return; }
  if (locked && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); $("next").click(); }
});
</script>
</body>
</html>
